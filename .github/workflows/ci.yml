name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, test & package checks
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the step-level `if: env.SONAR_TOKEN != ''` guard works.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Runtime hardening (audit mode first; switch to block + allowlist once egress is known).
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node version comes from .nvmrc (v24.18.0) — the toolchain requires Node 24.
      # Node 20 breaks the babel build (ERR_REQUIRE_ESM).
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn Berry 4.17.1)
        run: corepack enable

      - name: Install (immutable — lockfile must be up to date)
        run: yarn install --immutable

      - name: Generate index barrels
        run: yarn run index

      - name: Build (rollup — both packages)
        run: yarn run build

      - name: Lint
        run: yarn run lint

      - name: Test (expect 187/187 across 37 suites) + lcov for coverage upload
        run: yarn run test:all --coverageReporters=lcov --coverageReporters=text

      # --- Package-correctness gates (dual ESM/CJS). Run AFTER build. ---
      - name: publint (@semaver/core)
        run: yarn dlx publint@latest run ./packages/core
      - name: publint (@semaver/reflector)
        run: yarn dlx publint@latest run ./packages/reflector

      # Package-correctness gate: attw must resolve types cleanly in all module modes
      # (node10, node16-cjs, node16-esm, bundler). Blocking — the dual .d.ts/.d.cts split
      # keeps this green; a regression here should fail CI.
      - name: attw — are-the-types-wrong (@semaver/core)
        run: yarn dlx @arethetypeswrong/cli@latest --pack ./packages/core
      - name: attw — are-the-types-wrong (@semaver/reflector)
        run: yarn dlx @arethetypeswrong/cli@latest --pack ./packages/reflector

      # Bundle-size budget (min+brotli per export). Blocking — verifies tree-shaking holds.
      - name: size-limit
        run: yarn run size

      # Dead-code / unused-deps report. Non-blocking for now (informational) —
      # promote to blocking once the report stays clean.
      - name: knip (unused files/deps/exports)
        continue-on-error: true
        run: yarn run knip

      # Coverage upload is opt-in: only runs once CODECOV_TOKEN is configured.
      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # SonarQube Cloud analysis (quality + coverage). Opt-in: only runs once SONAR_TOKEN
      # is configured. Reads coverage/lcov.info produced by the test step above.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

      # Pack both packages (Node 24) and hand the tarballs to the smoke job, which
      # installs and imports them on every supported Node version.
      - name: Pack tarballs
        run: |
          mkdir -p dist-tarballs
          yarn workspace @semaver/core pack --out "$GITHUB_WORKSPACE/dist-tarballs/core.tgz"
          yarn workspace @semaver/reflector pack --out "$GITHUB_WORKSPACE/dist-tarballs/reflector.tgz"
      - name: Upload tarballs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tarballs
          path: dist-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Real install + import smoke test of the PACKED tarballs on every Node version we
  # claim to support (engines.node >=20). Proves the published artifacts load under
  # both module systems — not just that they build on Node 24.
  smoke:
    name: Smoke (Node ${{ matrix.node }}, ${{ matrix.module }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        module: [esm, cjs]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download tarballs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarballs
          path: dist-tarballs

      # Fresh scratch project — no workspace, no hoisting. Install the tarballs exactly
      # as an external consumer would (core first, then reflector against the local core).
      - name: Install packed tarballs into a scratch project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist-tarballs/core.tgz" \
            "$GITHUB_WORKSPACE/dist-tarballs/reflector.tgz"

      - name: Import (ESM)
        if: matrix.module == 'esm'
        run: |
          cd /tmp/smoke
          cat > smoke.mjs <<'EOF'
          import * as core from "@semaver/core";
          import * as reflector from "@semaver/reflector";
          if (typeof reflector.Reflector !== "function") {
            throw new Error("reflector.Reflector missing from ESM entry");
          }
          if (typeof core.ExtendedError !== "function") {
            throw new Error("core.ExtendedError missing from ESM entry");
          }
          console.log("esm import ok on node " + process.version);
          EOF
          node smoke.mjs

      - name: Require (CJS)
        if: matrix.module == 'cjs'
        run: |
          cd /tmp/smoke
          cat > smoke.cjs <<'EOF'
          const core = require("@semaver/core");
          const reflector = require("@semaver/reflector");
          if (typeof reflector.Reflector !== "function") {
            throw new Error("reflector.Reflector missing from CJS entry");
          }
          if (typeof core.ExtendedError !== "function") {
            throw new Error("core.ExtendedError missing from CJS entry");
          }
          console.log("cjs require ok on node " + process.version);
          EOF
          node smoke.cjs

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Validate PR commits
        run: yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

