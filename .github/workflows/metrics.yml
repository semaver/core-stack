name: Metrics

on:
  schedule:
    # Weekly, Monday ~06:13 UTC (off the :00 mark).
    - cron: '13 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    name: Collect download & dependents metrics
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect metrics
        run: |
          set -euo pipefail
          mkdir -p .metrics
          STAMP="$(date -u +%Y-%m-%d)"
          line="$STAMP"
          for pkg in @semaver/core @semaver/reflector; do
            enc="${pkg/\//%2F}"
            # weekly npm downloads
            dl="$(curl -sf "https://api.npmjs.org/downloads/point/last-week/$pkg" | jq -r '.downloads // 0')"
            # dependents count via ecosyste.ms (best-effort; 0 if unavailable)
            dep="$(curl -sf "https://packages.ecosyste.ms/api/v1/registries/npmjs.org/packages/$enc" | jq -r '.dependent_packages_count // 0' 2>/dev/null || echo 0)"
            line="$line,$pkg,dl=$dl,dependents=$dep"
            echo "$pkg: downloads(last-week)=$dl dependents=$dep"
          done
          echo "$line" >> .metrics/history.csv
          tail -5 .metrics/history.csv

      # `main` is a protected branch (no direct pushes), so we publish the metrics
      # as a build artifact instead of committing them. Each run keeps its own
      # snapshot; download from the run's Artifacts section.
      - name: Upload metrics artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics
          path: .metrics/history.csv
          retention-days: 90
