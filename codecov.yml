# Codecov configuration.
#
# `patch` is intentionally informational (non-blocking). Diff-only coverage
# penalises small diffs that add a thin `ExtendedError` subclass: Babel's
# transpilation of such a subclass emits a synthetic superclass-detection
# branch on the `super(...)` line that is unreachable from userland, so the
# file reports 50% branch coverage no matter how thoroughly the throw path is
# tested (see `CollisionPolicyError.ts`, which shows the same artifact). The
# behaviour itself is fully covered by the suite; we do not gate merges on this
# transpilation artifact. Whole-repo `project` coverage stays gated below.
coverage:
  status:
    project:
      default:
        target: auto
        # Allow a small dip so unrelated refactors don't fail the build, but
        # still catch genuine coverage regressions.
        threshold: 1%
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
